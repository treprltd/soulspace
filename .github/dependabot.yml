# Automated dependency updates (compliance finding #8).
# Weekly PRs for npm and GitHub Actions; production runtime deps are grouped
# so review stays manageable. Security updates from GitHub's advisory database
# are raised regardless of schedule.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    ignore:
      # Block ALL major bumps repo-wide. Majors need a deliberate, tested
      # migration (Next 14→16 / React 19, Tailwind 3→4, TypeScript 5→7, Stripe,
      # Resend, …) — an auto-PR only breaks CI. Minor/patch, including security
      # fixes, still flow and are safe to merge.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # 0.x packages: for these, "minor" carries breaking changes, so restrict
      # to patch-only — avoids breaking jumps like @supabase/ssr 0.3→0.12 and
      # @anthropic-ai/sdk 0.24→0.115, both of which need a manual migration.
      - dependency-name: "@anthropic-ai/sdk"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "@supabase/ssr"
        update-types: ["version-update:semver-minor"]
    groups:
      production-dependencies:
        dependency-type: "production"
      development-dependencies:
        dependency-type: "development"
    labels:
      - "dependencies"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "ci"
